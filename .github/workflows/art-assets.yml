name: Art asset integrity
on:
  pull_request:
    paths:
      - 'assets/art/**'
      - 'assets/ui/**'
      - 'design/art/illustrations/**'
      - 'design/art/store/**'
      - 'tools/art/**'
      - '.github/workflows/art-assets.yml'
  push:
    branches: [main]
    paths:
      - 'assets/art/**'
      - 'assets/ui/**'
      - 'design/art/illustrations/**'
      - 'design/art/store/**'
      - 'tools/art/**'
      - '.github/workflows/art-assets.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shipped art files
        run: python tools/art/verify_assets.py
