name: android-export

# Builds the Android APK of the Android preset (export_presets.cfg) with the pinned Godot and
# its export templates. A debug-signed APK is always produced; a release APK only when the
# keystore secrets exist. Run by hand, or by pushing a tag v*. Not verified on a device.
on:
  # a manual run needs this file on the default branch; until then a change to the export
  # configuration on a pull request runs it
  pull_request:
    paths:
      - export_presets.cfg
      - project.godot
      - .github/workflows/android-export.yml
      - tools/ci/check-export-pack.sh
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      GODOT_VERSION: 4.7.2-stable
      # SHA-512 of the official files (SHA512-SUMS.txt of the release)
      GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sSfL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          curl -sSfL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "${TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$templates_dir"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          mv "$RUNNER_TEMP"/templates/templates/* "$templates_dir/"
      - name: Android SDK components
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          echo "ANDROID_SDK=$sdk" >> "$GITHUB_ENV"
      - name: Debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4.7.tres editor_settings-4.tres; do
            cat > "$HOME/.config/godot/$name" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done
      - name: Import project
        run: '"$GODOT" --headless --import'
      - name: The pack holds the data and runs
        run: bash tools/ci/check-export-pack.sh
      - name: Export the debug APK
        run: |
          mkdir -p build
          "$GODOT" --headless --export-debug "Android" build/dogs-of-gods-debug.apk
          test -s build/dogs-of-gods-debug.apk
          "$ANDROID_SDK"/build-tools/35.0.1/apksigner verify --verbose build/dogs-of-gods-debug.apk
      - name: Export the release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          "$GODOT" --headless --export-release "Android" build/dogs-of-gods-release.apk
          "$ANDROID_SDK"/build-tools/35.0.1/apksigner verify --verbose build/dogs-of-gods-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/*.apk
